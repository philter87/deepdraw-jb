# The IDE this plugin is built against. Everything it uses is platform API, so
# a newer build here does not change what the plugin can run on — `sinceBuild`
# in build.gradle.kts is what states that.
platformVersion = 2024.3.5

# The DeepDraw library version embedded in the plugin. `fetchDeepDrawLib`
# downloads exactly this build from the CDN under an immutable version path
# (deepdraw CLAUDE.md §3).
#
# Both numbers below are written by `../deepdraw/sync-js.sh` out of that repo's
# package.json — the library and everything embedding it share one version.
# Edit them there, not here, or the next sync will overwrite the change.
deepdrawVersion = 0.13.2

pluginVersion = 0.13.2

org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
