# Releases the plugin: a change to `pluginVersion` is the trigger, the
# Marketplace is the destination, and a GitHub release with the same zip
# attached is the record.
#
# **Pushing to `main` is the whole of it.** `pluginVersion` in gradle.properties
# is the version — written by `deepdraw/sync-js.sh`, because the library and
# everything embedding it share one number — and the first step of the job asks
# whether this push *changed* it. Almost no push does, and the job stops there
# in seconds. The one that does is the release: checks, upload, GitHub release.
#
# **The version decides, not a tag.** The version is already the one true
# statement of what this build is, and asking it directly means there is nothing
# to keep in step with it: no tag to push by hand, none to forget, and none that
# can name a version nobody released. The tag that exists afterwards is written
# by `gh release create` — a GitHub release *is* a tag — so it is the record of
# the release rather than the request for one.
#
# Two secrets, both under Settings → Secrets and variables → Actions:
#
#   PUBLISH_TOKEN                                       required — the upload
#   CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD   optional — the signature
#
# Without the second set the zip goes up unsigned and the Marketplace signs it,
# which is the supported thing to do and needs no key of anyone's own.

name: Release

on:
  push:
    branches: [main]
  # Re-runs a release that failed after `pluginVersion` had already landed —
  # there is no push left to carry the change, so a hand on this button means
  # "release what `main` says now". It skips the gate for that reason. Pressed
  # on a version that went up already, it stops at the Marketplace, which will
  # not take a version it has; that refusal is the correct one.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        # The whole history, because the question below is asked of the commit
        # this push started from, which a shallow checkout does not have.
        with:
          fetch-depth: 0

      # The one question that decides whether this push is a release: did it
      # change `pluginVersion`? Read out of the file on both sides rather than
      # out of the diff, so that reformatting the line, or a merge that brings
      # the same version along a second time, is not mistaken for a bump.
      - name: Did this push change the version?
        id: version
        run: |
          version=$(sed -n 's/^pluginVersion *= *//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error::gradle.properties has no pluginVersion"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" != push ]; then
            # Run workflow, by hand: release what main says, gate skipped.
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $version — asked for by hand." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          before='${{ github.event.before }}'
          previous=$(git show "$before:gradle.properties" 2>/dev/null |
            sed -n 's/^pluginVersion *= *//p' | tr -d '[:space:]')

          if [ -z "$previous" ]; then
            # A force-push or a first push: what came before is not there to
            # read, and guessing it either releases nothing or releases twice.
            # Run workflow says which.
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::warning::cannot read pluginVersion at $before — not releasing $version on a guess; use Run workflow if it should go out"
            echo "The version before this push could not be read, so it was left alone. Run workflow releases $version." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$previous" = "$version" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "pluginVersion is still $version — nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "pluginVersion moved $previous → $version. Releasing." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 21 because the platform's own classes are Java 21; the plugin is still
      # emitted for 17 (build.gradle.kts).
      - uses: actions/setup-java@v4
        if: steps.version.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.new == 'true'

      # `check` is the tests. `verifyPlugin` is the promise `sinceBuild` makes:
      # it reads the plugin against the oldest IDE that claim covers, the one it
      # is built on and the newest released, with the same verifier JetBrains
      # runs on what arrives. It downloads those IDEs, and it is why this job
      # takes minutes rather than seconds — a release is the one place that is
      # worth waiting for, and the version gate is what keeps every other push
      # from paying it.
      #
      # `fetchDeepDrawLib` pulls the pinned DeepDraw build from the CDN here, so
      # a version can only be released once the library CI has published it. A
      # build failing on a 404 for `v<deepdrawVersion>` is that, and the fix is
      # to wait for the library, not to touch this repo.
      - name: Check
        if: steps.version.outputs.new == 'true'
        run: ./gradlew check verifyPlugin --console=plain

      - name: Publish to the JetBrains Marketplace
        if: steps.version.outputs.new == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --console=plain

      # The same zip that went to the Marketplace, kept where a reader who wants
      # "Install Plugin from Disk…" can reach it without an account. The `v` tag
      # is written here, by `gh release create`, and only after the upload
      # succeeded: it marks the commit that was released rather than asking for
      # a release.
      #
      # It has to be this and not `git push origin "v$version"`, which is what
      # 0.6.1 failed on:
      #
      #   ! [remote rejected] v0.6.1 -> v0.6.1 (refusing to allow a GitHub App
      #     to create or update workflow `.github/workflows/release.yml`
      #     without `workflows` permission)
      #
      # A ref pushed over git by `GITHUB_TOKEN` is refused when the commit it
      # points at touches `.github/workflows`, and `workflows` is not a
      # permission `GITHUB_TOKEN` can be granted — so any release of a commit
      # that edited this file would fail there, after publishing. The releases
      # API writes the tag server-side and is not subject to it.
      - name: GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          zip="build/distributions/deepdraw-jb-$version.zip"
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$zip" --clobber
          else
            gh release create "v$version" --title "v$version" --generate-notes "$zip"
          fi
