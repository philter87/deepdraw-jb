<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  The page is served from the plugin's own resources over a scheme handler, so
  everything it loads is local. The one exception is the icon picker, which
  talks to whichever Iconify-compatible API the reader configured — and that is
  a setting, so the policy can only bound it by scheme, not by host.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src https: data: blob:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepDraw</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #fff; }
  #app { height: 100vh; }
</style>
</head>
<body>
<div id="app"></div>
<script src="lib/deepdraw.js"></script>
<script src="main.js"></script>
</body>
</html>
